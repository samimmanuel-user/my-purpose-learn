image:
  repository: demo-backend
  tag: "1.0.0"
  pullPolicy: IfNotPresent   # image is built inside minikube's docker

db:
  host: postgres
  name: demo
  user: demo
  password: demo             # test only

service:
  type: NodePort
  nodePort: 30080

migration:
  delaySeconds: 45

# Run workloads on the dedicated worker node, not the control plane
nodeSelector:
  node-role.kubernetes.io/worker: ""
